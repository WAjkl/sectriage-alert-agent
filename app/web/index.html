<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecTriage · 告警降噪研判</title>
<style>
  :root{ --bg:#0f1720; --panel:#17222e; --line:#25333f; --txt:#e6edf3; --sub:#8fa3b5;
         --blue:#3b82f6; --red:#e5484d; --amber:#e0a458; --green:#3dd68c; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:1px 7px}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:5px;
         padding:7px 14px;font-family:inherit;font-size:13.5px;cursor:pointer}
  button:hover{border-color:var(--blue);color:#fff}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  input{background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--txt);
        padding:7px 11px;font-family:inherit;font-size:13.5px;min-width:260px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 16px;min-width:130px}
  .stat b{display:block;font-size:22px;font-weight:600}
  .stat span{font-size:11.5px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{color:var(--sub);font-weight:500;font-size:12px}
  tr:hover td{background:#1b2733}
  .v-tp{color:var(--red)} .v-fp{color:var(--green)} .v-human{color:var(--amber)}
  .mono{font-family:Consolas,monospace;font-size:12px}
  .hint{font-size:12px;color:var(--sub);margin:6px 0 14px}
  pre{background:#0b1218;border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;
      font-size:12px;color:#b9c9d6}
</style>
</head>
<body>
<header>
  <h1>SecTriage</h1>
  <span class="tag">告警降噪 + 研判</span>
  <span class="tag" id="svc">连接中…</span>
  <span style="margin-left:auto;font-size:12px;color:var(--sub)">给值班用的：先压量，再判真假</span>
</header>

<div class="wrap">
  <div class="row">
    <button class="primary" onclick="loadStats()">① 看降噪效果</button>
    <button onclick="loadClusters()">② 看事件列表</button>
    <button onclick="loadTriage()">③ 让模型研判</button>
    <button onclick="runAll()">④ 跑全量决策</button>
  </div>
  <div class="hint">数据是合成告警（带真值）。点 ③ 能看到每条判定的置信度和依据的 SOP。</div>

  <div class="stats" id="stats"></div>
  <div id="out"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const out = html => { $('#out').innerHTML = html; };

async function api(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error(path + ' → ' + r.status);
  return r.json();
}

async function health(){
  try{
    const h = await api('/health');
    $('#svc').textContent = '服务正常 · ' + h.service;
  }catch(e){ $('#svc').textContent = '连不上后端'; }
}

async function loadStats(){
  const d = await api('/stats');
  $('#stats').innerHTML = `
    <div class="stat"><b>${d.alerts}</b><span>原始告警</span></div>
    <div class="stat"><b>${d.clusters}</b><span>聚合后事件</span></div>
    <div class="stat"><b>${(d.denoise_rate*100).toFixed(1)}%</b><span>降噪率</span></div>
    <div class="stat"><b>${d.avg_alerts_per_cluster}</b><span>平均每事件告警数</span></div>`;
  out('<div class="hint">降噪率 = 1 − 事件数 / 告警数。这一步是纯规则，不调模型。</div>');
}

async function loadClusters(){
  const d = await api('/clusters?limit=12');
  let h = `<table><tr><th>事件</th><th>规则</th><th>资产</th><th>源 IP</th><th>条数</th><th>时间</th></tr>`;
  d.items.forEach(c=>{
    h += `<tr><td class="mono">${c.cluster_id}</td><td>${c.rule}</td><td>${c.asset}</td>
          <td class="mono">${c.src_ip}</td><td>${c.count}</td>
          <td class="mono">${c.first_ts.slice(11)} → ${c.last_ts.slice(11)}</td></tr>`;
  });
  h += '</table>';
  out(h);
}

const cls = v => v==='true_positive' ? 'v-tp' : (v==='false_positive' ? 'v-fp' : 'v-human');

async function loadTriage(){
  const d = await api('/triage?limit=8');
  let h = `<table><tr><th>事件</th><th>规则</th><th>条数</th><th>判定</th><th>置信度</th><th>依据</th></tr>`;
  d.items.forEach(it=>{
    const v = it.verdict;
    h += `<tr><td class="mono">${it.cluster_id}</td><td>${it.rule}</td><td>${it.count}</td>
      <td class="${cls(v.verdict)}">${v.verdict}</td>
      <td class="mono">${v.confidence.toFixed(2)}</td>
      <td>${v.reason}<br><span class="mono" style="color:#8fa3b5">${v.sop_id||'-'} · ${v.mode}</span></td></tr>`;
  });
  h += '</table>';
  out(h);
}

async function runAll(){
  const d = await api('/run');
  let h = `<div class="stats">
    <div class="stat"><b>${d.alerts}</b><span>告警</span></div>
    <div class="stat"><b>${d.clusters}</b><span>事件</span></div>`;
  Object.entries(d.routes).forEach(([k,v])=>{
    h += `<div class="stat"><b>${v}</b><span>${k}</span></div>`;
  });
  h += `</div><pre>${JSON.stringify(d.routes, null, 2)}</pre>`;
  h += '<div class="hint">auto_close = 自动关（只对低价值资产的误报）；escalate = 升级工单（要人确认）；need_human = 转人工。</div>';
  out(h);
}

health(); loadStats();
</script>
</body>
</html>
